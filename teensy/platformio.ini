; Iki firmware secenegi ayni suruculeri paylasir:
;   pio run -e superloop          -> stingray_teensy/stingray_teensy.ino (zaman dilimli dongu)
;   pio run -e freertos           -> stingray_teensy_rtos/main.cpp (FreeRTOS gorevleri)
;   pio run -e freertos_carrier   -> Rev A tasiyici kart ile FreeRTOS (CARRIER_BOARD_REV=1)
;   pio run -e superloop_carrier  -> Rev A tasiyici kart ile superloop (CARRIER_BOARD_REV=1)

[platformio]
src_dir = .
default_envs = freertos

[env]
platform = teensy
board = teensy41
framework = arduino
build_flags =
    -D USB_SERIAL
    -I stingray_teensy
lib_deps =
    https://github.com/tonton81/WDT_T4.git
monitor_speed = 115200
monitor_port = /dev/ttyACM0
upload_protocol = teensy-cli

[env:superloop]
build_src_filter =
    +<stingray_teensy/*.cpp>
    +<stingray_teensy_superloop/>

[env:freertos]
build_src_filter =
    +<stingray_teensy/*.cpp>
    +<stingray_teensy_rtos/>
lib_deps =
    ${env.lib_deps}
    https://github.com/tsandmann/freertos-teensy.git

[env:superloop_carrier]
extends = env:superloop
build_flags =
    ${env.build_flags}
    -D CARRIER_BOARD_REV=1

[env:freertos_carrier]
extends = env:freertos
build_flags =
    ${env.build_flags}
    -D CARRIER_BOARD_REV=1
